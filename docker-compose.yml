# =============================================================================
# Ananse Center — production stack (Coolify / VPS)
#
#   docker compose up -d --build
#
# Services: PostgreSQL 16, Redis 7, Fastify API (backend), Next.js (web)
# Internal: postgres:5432, redis:6379, backend:4000
# Point Coolify at this file only.
# =============================================================================

name: ananse

services:
  postgres:
    image: postgres:16-alpine
    container_name: ananse-db
    restart: unless-stopped
    networks:
      - ananse
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ananse-redis
    restart: unless-stopped
    networks:
      - ananse
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ananse-backend
    restart: unless-stopped
    networks:
      - ananse
    environment:
      NODE_ENV: production
      BACKEND_PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN}
      SKIP_PRISMA_SEED: ${SKIP_PRISMA_SEED:-false}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_CURRENCY: ${PAYSTACK_CURRENCY:-GHS}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}
      NEXT_PUBLIC_LMS_PORTAL_URL: ${NEXT_PUBLIC_LMS_PORTAL_URL:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      LEGACY_SITE_HOST: ${LEGACY_SITE_HOST:-}
      NEXT_PUBLIC_LEGACY_SITE_HOST: ${NEXT_PUBLIC_LEGACY_SITE_HOST:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Site Administrator}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      ADMIN_ROLE: ${ADMIN_ROLE:-admin}
      ADMIN_ALLOW_SYSTEM_OPS: ${ADMIN_ALLOW_SYSTEM_OPS:-false}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_FORM_MAX: ${RATE_LIMIT_FORM_MAX:-8}
      RATE_LIMIT_DONATION_MAX: ${RATE_LIMIT_DONATION_MAX:-15}
      STRICT_PRODUCTION_ENV: ${STRICT_PRODUCTION_ENV:-false}
      MEDIA_UPLOAD_DIR: /app/backend/uploads
    volumes:
      - media_uploads:/app/backend/uploads
    ports:
      - "${BACKEND_PORT:-4035}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}
        NEXT_PUBLIC_LMS_PORTAL_URL: ${NEXT_PUBLIC_LMS_PORTAL_URL:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_LEGACY_SITE_HOST: ${NEXT_PUBLIC_LEGACY_SITE_HOST:-}
        NEXT_PUBLIC_ROBOTS_NOINDEX: ${NEXT_PUBLIC_ROBOTS_NOINDEX:-false}
    container_name: ananse-web
    restart: unless-stopped
    networks:
      - ananse
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}
      NEXT_PUBLIC_LMS_PORTAL_URL: ${NEXT_PUBLIC_LMS_PORTAL_URL:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_LEGACY_SITE_HOST: ${NEXT_PUBLIC_LEGACY_SITE_HOST:-}
      LEGACY_SITE_HOST: ${LEGACY_SITE_HOST:-}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NEXT_PUBLIC_ROBOTS_NOINDEX: ${NEXT_PUBLIC_ROBOTS_NOINDEX:-false}
      RUNNING_IN_DOCKER: "true"
    ports:
      - "${FRONTEND_PORT:-3035}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  media_uploads:

networks:
  ananse:
    driver: bridge
